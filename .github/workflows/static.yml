name: Build
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build
        shell: bash
      - name: Test
        run: source ./nvm-install && npm test
        shell: bash
